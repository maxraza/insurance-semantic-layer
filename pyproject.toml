[project]
name = "insurance-semantic-layer"
version = "0.1.0"
description = "A semantic layer for P&C insurance metrics: explicit time bases and valuation dates, compiled to SQL, with a synthetic motor book and an LLM evaluation harness."
readme = "README.md"
authors = [
    { name = "Hassan Raza", email = "max@rfstudio.co" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["insurance", "actuarial", "semantic-layer", "text-to-sql", "llm", "duckdb"]
dependencies = [
    "anthropic>=1.13.0",
    "duckdb>=1.5.6",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
isl = "isl.cli:app"

[tool.uv.build-backend]
module-name = "isl"

[tool.ruff]
line-length = 110
lint.ignore = ["C408"]
lint.per-file-ignores = { "src/isl/cli.py" = ["B008", "RUF013"], "scripts/*" = ["PLC0206", "ISC004", "PLW1510", "RUF059"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
